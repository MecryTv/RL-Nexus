<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RL Nexus · __TITLE__</title>
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" href="__BASE__/assets/images/rl-nexus-n-48.png">
<!-- W-0125: Epic-Konto verbinden. Aufbau wie die VPN-Seite (W-0057), eine Vorlage für alle Stände: Bestätigen, verbunden, abgelehnt. -->
<style>
@font-face{font-family:"Oxanium";font-weight:500;font-display:swap;src:url("__BASE__/assets/fonts/oxanium-500.woff2") format("woff2")}
@font-face{font-family:"Oxanium";font-weight:700;font-display:swap;src:url("__BASE__/assets/fonts/oxanium-700.woff2") format("woff2")}
@font-face{font-family:"Oxanium";font-weight:800;font-display:swap;src:url("__BASE__/assets/fonts/oxanium-800.woff2") format("woff2")}
@font-face{font-family:"Rajdhani";font-weight:700;font-display:swap;src:url("__BASE__/assets/fonts/rajdhani-700.woff2") format("woff2")}
:root{--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);--text:#f2f4f7;--text2:#a8b0bc;--text3:#8f98a5;--brand:#ff1e2d;--deep:#d81424;--warn:#ffc53d;--win:#35e07f}
.tone-brand{--accent:var(--brand);--accent-soft:rgba(255,30,45,.07)}
.tone-win{--accent:var(--win);--accent-soft:rgba(53,224,127,.07)}
.tone-warn{--accent:var(--warn);--accent-soft:rgba(255,197,61,.07)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100vh;color:var(--text);font:500 15px/1.5 "Oxanium","Segoe UI",sans-serif;background:radial-gradient(ellipse at 50% 0,var(--accent-soft),transparent 60%),#07090c;background-color:#07090c}
.b{border:1px solid var(--line2);padding:0 16px;font:700 12px "Rajdhani";letter-spacing:.1em;text-transform:uppercase;min-height:44px;display:inline-flex;align-items:center;justify-content:center;color:var(--text);text-decoration:none}
.b.main{background:var(--deep);border-color:var(--deep);color:#fff}
.b:focus-visible{outline:2px solid #fff;outline-offset:2px}
.card{max-width:560px;margin:34px auto 40px;padding:0 18px;display:grid;gap:14px}
.headline{display:flex;gap:16px;align-items:center}
.mark{width:64px;height:64px;flex:none;border-radius:50%;border:3px solid var(--accent);background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.mark svg{width:30px;height:30px}
h1{font:800 24px "Oxanium";margin:0}
.headline p{margin:2px 0 0;color:var(--text2)}
.headline p b{color:var(--text)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.facts:empty{display:none}
.fact{border:1px solid var(--line);background:#0a0f15;padding:9px 11px;min-width:0}
.fact span{display:block;font:700 11px "Rajdhani";letter-spacing:.12em;text-transform:uppercase;color:var(--text3)}
.fact b{font:700 14px "Oxanium";overflow-wrap:anywhere}
.why{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 12px;font-size:14px;color:var(--text2)}
.why b{color:var(--text)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.who{display:flex;gap:10px;align-items:center;color:var(--text3);font-size:13px}
.who:empty{display:none}
.who span{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#b8358f,#7a28b8);display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;overflow:hidden}
.who img{width:100%;height:100%;object-fit:cover}
@media(max-width:560px){.headline{flex-direction:column;text-align:center}.facts{grid-template-columns:1fr}.btns{flex-direction:column}.card{margin-top:22px}}
</style>
</head>
<body class="tone-__TONE__">
<main class="card">
  <div class="headline">
    <div class="mark" aria-hidden="true">__ICON__</div>
    <div><h1>__TITLE__</h1><p>__TEXT__</p></div>
  </div>
  <div class="facts">__FACTS__</div>
  <div class="why">__WHY__</div>
  <div class="btns">__BUTTONS__</div>
  <div class="who">__WHO__</div>
</main>
</body>
</html>
