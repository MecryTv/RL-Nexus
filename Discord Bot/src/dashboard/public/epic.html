<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RL Nexus · __PAGE__</title>
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" href="__BASE__/assets/images/rl-nexus-n-48.png">
<!-- W-0125, Design W-0130 (Richtung B „Die Verbindung“): eine Vorlage für alle Stände.
     Links das Discord-Konto, rechts das Epic-Konto, dazwischen die Leitung:
     gestrichelt solange offen, durchgezogen wenn verbunden, unterbrochen bei einer Absage. -->
<style>
@font-face{font-family:"Oxanium";font-weight:500;font-display:swap;src:url("__BASE__/assets/fonts/oxanium-500.woff2") format("woff2")}
@font-face{font-family:"Oxanium";font-weight:700;font-display:swap;src:url("__BASE__/assets/fonts/oxanium-700.woff2") format("woff2")}
@font-face{font-family:"Oxanium";font-weight:800;font-display:swap;src:url("__BASE__/assets/fonts/oxanium-800.woff2") format("woff2")}
@font-face{font-family:"Rajdhani";font-weight:700;font-display:swap;src:url("__BASE__/assets/fonts/rajdhani-700.woff2") format("woff2")}
:root{--fd:"Oxanium","Segoe UI",system-ui,sans-serif;--fl:"Rajdhani","Segoe UI",system-ui,sans-serif;--bg:#07090c;--panel:#0b1016;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);--text:#f2f4f7;--text2:#a8b0bc;--text3:#8f98a5;--deep:#d81424;--win:#35e07f;--warn:#ffc53d;--discord:#5865f2}
.tone-brand{--accent:#ff1e2d;--glow:rgba(255,30,45,.14)}
.tone-win{--accent:var(--win);--glow:rgba(53,224,127,.11)}
.tone-warn{--accent:var(--warn);--glow:rgba(255,197,61,.1)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100vh;color:var(--text);font:500 15px/1.5 "Oxanium","Segoe UI",sans-serif;background-color:var(--bg);
  background-image:radial-gradient(ellipse 90% 55% at 50% 0,var(--glow),transparent 70%),linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:100% 100%,100% 28px,28px 100%}
.card{max-width:520px;margin:28px auto 40px;padding:0 16px}
.bevel{clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.brand{display:flex;align-items:center;gap:8px;font:800 14px var(--fd)}
.brand img{width:24px;height:24px}
.brand small{margin-left:auto;font:700 11px var(--fl);letter-spacing:.16em;text-transform:uppercase;color:var(--text3)}
.pair{display:grid;grid-template-columns:minmax(0,1fr) 56px minmax(0,1fr);align-items:center;margin:22px 0 18px}
.acct{padding:14px 8px 12px;text-align:center;background:var(--panel);border:1px solid var(--line2);min-width:0}
.pic{width:52px;height:52px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;overflow:hidden;font:800 20px var(--fd);color:#fff}
.pic img{width:100%;height:100%;object-fit:cover}
.pic.d{background:linear-gradient(135deg,#6b7cff,#b06bff);box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--discord)}
.pic.e{position:relative;border-radius:0;background:none}
/* epicgames.png hat viel leeren Rand: Logo bei x 243-340, y 153-262 von 584x427. Auf 46 px Höhe gezogen und mittig gesetzt. */
.pic.e img{position:absolute;width:246px;height:auto;max-width:none;left:-97px;top:-61px;object-fit:fill}
.pic.q{background:rgba(255,255,255,.04);color:var(--text3);border:2px dashed var(--line2)}
.acct b{display:block;font:800 14px/1.3 var(--fd);overflow-wrap:anywhere}
.acct small{display:block;color:var(--text3);font:700 12.5px var(--fl);letter-spacing:.04em;overflow-wrap:anywhere}
.tag{display:inline-block;margin-top:8px;padding:1px 7px;font:700 11px var(--fl);letter-spacing:.14em;text-transform:uppercase;color:var(--text2);border:1px solid var(--line2)}
.wire{position:relative;height:34px;display:grid;place-items:center}
.wire::before{content:"";position:absolute;left:-2px;right:-2px;top:50%;border-top:2px dashed var(--accent)}
.tone-win .wire::before{border-top-style:solid}
.tone-warn .wire::before{right:56%}
.tone-warn .wire::after{content:"";position:absolute;left:56%;right:-2px;top:50%;border-top:2px dashed var(--line2)}
.wire i{position:relative;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--accent);border:2px solid var(--accent)}
.wire svg{width:16px;height:16px}
.head{text-align:center}
h1{font:800 26px/1.2 var(--fd);margin:0}
.head p{margin:6px auto 0;max-width:38ch;color:var(--text2)}
.head p b{color:var(--text)}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:14px}
.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 6px;font:700 13px var(--fd);background:var(--panel);border:1px solid var(--line2)}
.chip img{width:24px;height:24px}
.chip span{font:700 11px var(--fl);letter-spacing:.12em;text-transform:uppercase;color:var(--text3)}
.chip.none{padding-left:10px;color:var(--text2)}
.note{margin-top:16px;padding:11px 13px;border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);background:color-mix(in srgb,var(--accent) 7%,transparent);color:var(--text2);font-size:14px}
.note:empty{display:none}
.note b{color:var(--text)}
.btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:16px}
.b{display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;font:700 13px var(--fl);letter-spacing:.12em;text-transform:uppercase;color:var(--text);text-decoration:none;border:1px solid var(--line2);background:rgba(255,255,255,.03);clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);transition:background-color .15s}
.b:hover{background:rgba(255,255,255,.07)}
.b.main{background:var(--deep);border-color:var(--deep);color:#fff}
.b.main:hover{background:#b80f1d}
.tone-win .b.main{background:#17733f;border-color:#17733f}
.tone-win .b.main:hover{background:#1b8549}
.b svg,.more svg,.foot svg{width:16px;height:16px;flex:none}
.more{text-align:center}
.more:empty{display:none}
.more a{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 10px;color:var(--text2);font:700 14px var(--fl);letter-spacing:.05em;text-decoration:none}
.more a:hover{color:var(--text)}
.foot{display:flex;gap:8px;align-items:flex-start;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);color:var(--text3);font-size:13px}
.foot:empty{display:none}
.foot svg{margin-top:2px;color:var(--win)}
a:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media(max-width:420px){.card{margin-top:18px}.pair{grid-template-columns:minmax(0,1fr) 40px minmax(0,1fr)}h1{font-size:23px}.acct{padding:12px 6px 10px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body class="tone-__TONE__">
<main class="card">
  <div class="brand"><img src="__BASE__/assets/images/rl-nexus-n-48.png" alt="">RL Nexus<small>__STEP__</small></div>
  <div class="pair">
    <div class="acct bevel">__DISCORD__<span class="tag">Discord</span></div>
    <div class="wire" aria-hidden="true"><i>__ICON__</i></div>
    <div class="acct bevel">__EPIC__<span class="tag">Epic Games</span></div>
  </div>
  <div class="head"><h1>__TITLE__</h1><p>__TEXT__</p></div>
  <div class="chips">__RANKS__</div>
  <div class="note"__ALERT__>__WHY__</div>
  <div class="btns">__BUTTONS__</div>
  <div class="more">__MORE__</div>
  <div class="foot">__FOOT__</div>
</main>
</body>
</html>
