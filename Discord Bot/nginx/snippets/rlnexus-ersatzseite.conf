# Ersatzseite, wenn der Container hinter einer Nexus-Seite nicht antwortet
# (nginx/ersatzseite, auf dem Server unter /var/www/ersatzseite).
#
# Vorlage für /etc/nginx/snippets/rlnexus-ersatzseite.conf, eingebunden im
# server-Block von nexus-emb.de, dashboard., admin. und status.:
#   include snippets/rlnexus-ersatzseite.conf;
#
# Nur 502 und 504, die nginx selbst erzeugt, weil der Container nicht antwortet.
# Schickt der Container selbst einen Fehler, etwa 503 während der Wartung, bleibt
# es bei seiner Seite: proxy_intercept_errors ist aus.

location ^~ /_ersatz/ {
    alias /var/www/ersatzseite/;
}

error_page 502 504 /_ersatz/index.html;
