# Weiterleitung: discord.nexus-emb.de auf den Discord-Support-Server (W-0144)
#
# nginx auf dem Host, Vorlage für /etc/nginx/sites-available/discord.nexus-emb.de:
#   sudo cp nginx/discord.nexus-emb.de.conf /etc/nginx/sites-available/discord.nexus-emb.de
#   sudo ln -s /etc/nginx/sites-available/discord.nexus-emb.de /etc/nginx/sites-enabled/discord.nexus-emb.de
#   sudo nginx -t && sudo systemctl reload nginx
#
# Der Block steht auf Port 80. Auf dem Server steht derselbe Block ein zweites
# Mal mit listen 443 ssl und dem Cloudflare-Ursprungszertifikat, wie bei admin.
# und webmail. (docs/Hosting.md, Zertifikate). Die Subdomain läuft deshalb über
# den Proxy von Cloudflare.
#
# 302 statt 301: Die Einladung kann sich ändern, und einen 301 merken sich
# Browser dauerhaft. Kein Zugriffsprotokoll: Hier gibt es nichts zu sehen, und
# so steht auch keine IP darin.

server {
    listen 80;
    listen [::]:80;
    server_name discord.nexus-emb.de;
    access_log off;

    return 302 https://discord.gg/CjG2HFGw95;
}
