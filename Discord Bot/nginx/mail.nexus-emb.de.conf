# Mailcow (Weboberfläche, SOGo, ActiveSync, Autodiscover): mail.nexus-emb.de
#
# nginx auf dem Host, Vorlage für /etc/nginx/sites-available/mail.nexus-emb.de:
#   sudo cp nginx/mail.nexus-emb.de.conf /etc/nginx/sites-available/mail.nexus-emb.de
#   sudo ln -s /etc/nginx/sites-available/mail.nexus-emb.de /etc/nginx/sites-enabled/mail.nexus-emb.de
#   sudo nginx -t && sudo systemctl reload nginx
#
# Das Zertifikat holt Mailcow selbst, der Block steht deshalb schon auf 443. Die Datei steht für sich: Sie
# bringt ihre gemeinsamen Einstellungen selbst mit, unter eigenen Namen,
# damit nginx sie neben den anderen laden kann.
#
# Was auf dem Server dazu passen muss:
#   127.0.0.1:8081    Mailcow, HTTP_PORT in mailcow.conf. Dazu dort HTTP_BIND=127.0.0.1,
#                     HTTPS_PORT=8443, HTTPS_BIND=127.0.0.1, HTTP_REDIRECT=n.
#   /opt/mailcow-dockerized/data/assets/ssl    das Zertifikat, das Mailcow holt.
#                     Nach einer Verlängerung braucht nginx ein reload (Cron, docs/Hosting.md).

# Im Zugriffsprotokoll steht die IP gekürzt: bei IPv4 ohne das letzte Stück,
# bei IPv6 nur die ersten drei Blöcke. So steht es in der Datenschutzerklärung.
map $remote_addr $rlnexus_ip_mail {
    "~^(?<v4>\d+\.\d+\.\d+)\.\d+$"                       $v4.0;
    "~^(?<v6>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*):"   $v6::;
    default                                              -;
}
log_format rlnexus_mail '$host $rlnexus_ip_mail [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

# W-0070: Die Weboberfläche von Mailcow (Anmeldung, Admin) nur aus dem
# Tailscale-Netz. Öffentlich bleibt, was Mail-Apps brauchen: SOGo samt
# CalDAV/CardDAV, ActiveSync, Autodiscover, Autoconfig und /.well-known.
# mail. läuft ohne Cloudflare-Proxy, $remote_addr ist also die echte Adresse.
geo $rlnexus_mail_tailnet {
    default             0;
    127.0.0.1           1;
    ::1                 1;
    100.64.0.0/10       1;  # Tailscale IPv4
    fd7a:115c:a1e0::/48 1;  # Tailscale IPv6
}
map $uri $rlnexus_mail_public {
    default                                                              0;
    "~*^/(SOGo|Microsoft-Server-ActiveSync|autodiscover|\.well-known)(/|$)" 1;
    "/mail/config-v1.1.xml"                                              1;
}
map "$rlnexus_mail_tailnet$rlnexus_mail_public" $rlnexus_mail_blocked {
    "00"    1;
    default 0;
}

# Wie in der Anleitung von Mailcow für einen Reverse Proxy: Mailcow holt sein
# Zertifikat selbst, nginx reicht die Prüfung von Let's Encrypt an Mailcow
# weiter und zeigt den Browsern dieselben Dateien. E-Mail selbst (SMTP, IMAP)
# geht an nginx vorbei direkt zu Mailcow.

server {
    listen 80;
    listen [::]:80;
    server_name mail.nexus-emb.de autodiscover.nexus-emb.de autoconfig.nexus-emb.de;

    # Hinter dem Proxy von Cloudflare: die echte Adresse aus CF-Connecting-IP,
    # aber nur bei Anfragen aus den Netzen von Cloudflare. Liste von
    # https://www.cloudflare.com/ips/, Stand Oktober 2026. Ohne Cloudflare
    # schadet sie nicht.
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Eigenes Format statt des Standards, sonst schriebe Debians nginx.conf
    # zusätzlich die volle Adresse mit.
    access_log /var/log/nginx/access.log rlnexus_mail;

    location ^~ /.well-known/acme-challenge/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mail.nexus-emb.de autodiscover.nexus-emb.de autoconfig.nexus-emb.de;

    # Hinter dem Proxy von Cloudflare: die echte Adresse aus CF-Connecting-IP,
    # aber nur bei Anfragen aus den Netzen von Cloudflare. Liste von
    # https://www.cloudflare.com/ips/, Stand Oktober 2026. Ohne Cloudflare
    # schadet sie nicht.
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Eigenes Format statt des Standards, sonst schriebe Debians nginx.conf
    # zusätzlich die volle Adresse mit.
    access_log /var/log/nginx/access.log rlnexus_mail;

    ssl_certificate /opt/mailcow-dockerized/data/assets/ssl/cert.pem;
    ssl_certificate_key /opt/mailcow-dockerized/data/assets/ssl/key.pem;

    # Anhänge begrenzt Mailcow selbst.
    client_max_body_size 0;

    location / {
        # W-0070: Weboberfläche nur über Tailscale, siehe geo/map oben.
        if ($rlnexus_mail_blocked) {
            return 403;
        }

        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # ActiveSync hält Verbindungen bis zu einer Stunde offen, SOGo braucht große Puffer.
        proxy_read_timeout 3650s;
        proxy_send_timeout 3650s;
        proxy_buffer_size 128k;
        proxy_buffers 64 512k;
        proxy_busy_buffers_size 512k;
    }
}

# W-0070: Die Weboberfläche von Mailcow über Tailscale, unter dem Namen des
# Hosts im Tailnet (docs/Hosting.md, „Mailcow-Oberfläche über Tailscale“).
# Name und Zertifikat gehören zum eigenen Tailnet, hier rlnexus-vps.tail0fd142.ts.net.
# Kein listen auf die 100.x-Adresse: Wäre tailscale0 beim Start noch nicht da,
# startete nginx sonst gar nicht. Stattdessen nur Anfragen aus dem Tailnet.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rlnexus-vps.tail0fd142.ts.net;

    ssl_certificate /etc/ssl/tailscale/rlnexus-vps.crt;
    ssl_certificate_key /etc/ssl/tailscale/rlnexus-vps.key;

    if ($rlnexus_mail_tailnet = 0) {
        return 403;
    }

    client_max_body_size 0;

    location / {
        proxy_pass http://127.0.0.1:8081;
        # Mailcow kennt nur seinen eigenen Namen.
        proxy_set_header Host mail.nexus-emb.de;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect https://mail.nexus-emb.de/ /;
        proxy_read_timeout 3650s;
        proxy_send_timeout 3650s;
        proxy_buffer_size 128k;
        proxy_buffers 64 512k;
        proxy_busy_buffers_size 512k;
    }
}
