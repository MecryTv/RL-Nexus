# SnappyMail/Afterlogic: webmail.nexus-emb.de (W-0070) und Port 8444 im Tailnet
#
# Stand des Servers vom 15.11.2026 (W-0106). Vorlage für /etc/nginx/sites-available/webmail.nexus-emb.de:
#   sudo cp nginx/webmail.nexus-emb.de.conf /etc/nginx/sites-available/webmail.nexus-emb.de
#   sudo ln -s /etc/nginx/sites-available/webmail.nexus-emb.de /etc/nginx/sites-enabled/webmail.nexus-emb.de
#   sudo nginx -t && sudo systemctl reload nginx

# Im Zugriffsprotokoll steht die IP gekürzt: bei IPv4 ohne das letzte Stück,
# bei IPv6 nur die ersten drei Blöcke. So steht es in der Datenschutzerklärung (W-0106).
map $remote_addr $rlnexus_ip_webmail {
    "~^(?<v4>\d+\.\d+\.\d+)\.\d+$"                       $v4.0;
    "~^(?<v6>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*):"   $v6::;
    default                                              -;
}
log_format rlnexus_webmail '$host $rlnexus_ip_webmail [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name webmail.nexus-emb.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name webmail.nexus-emb.de;
    access_log /var/log/nginx/access.log rlnexus_webmail;
    # Nur über Cloudflare, sonst lässt sich Access über die Server-IP umgehen (W-0106).
    include snippets/rlnexus-nur-cloudflare.conf;

    ssl_certificate /etc/ssl/cloudflare/origin.pem; # W-0070: Cloudflare-Ursprungszertifikat
    ssl_certificate_key /etc/ssl/cloudflare/origin.key; # W-0070
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # W-0070: Webmail nur über Tailscale. Hinter Cloudflare sieht nginx keine
    # Tailnet-Adresse, deshalb geht hier jeder weiter auf den Namen im Tailnet.
    location / {
        return 302 https://rlnexus-vps.tail0fd142.ts.net:8444$request_uri;
    }
}

# W-0070: Afterlogic unter dem Namen des Hosts im Tailnet, Port 8444. ufw lässt
# 8444 von außen nicht durch, Tailscale nimmt tailscale0 vor ufw an; dazu nur
# Adressen aus dem Tailnet (geo in mail.nexus-emb.de).
server {
    listen 8444 ssl;
    listen [::]:8444 ssl;
    http2 on;
    server_name rlnexus-vps.tail0fd142.ts.net;
    access_log /var/log/nginx/access.log rlnexus_webmail;

    ssl_certificate /etc/ssl/tailscale/rlnexus-vps.crt;
    ssl_certificate_key /etc/ssl/tailscale/rlnexus-vps.key;

    if ($rlnexus_mail_tailnet = 0) {
        return 403;
    }

    # Anhänge beim Schreiben.
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
