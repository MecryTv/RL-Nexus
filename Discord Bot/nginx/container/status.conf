# Die Statusseite im Container rlnexus-status (docker-compose.prod.yml), Port 8091 auf
# 127.0.0.1. Davor steht nginx auf dem Host (nginx/status.nexus-emb.de.conf): Er hat das
# Zertifikat, liest die echte Adresse hinter Cloudflare und schreibt das
# Zugriffsprotokoll mit gekürzter IP. Hier geht es nur noch um die Seite.
#
# Im Container eingehängt:
#   /srv/status     STATUS_DIR (/var/www/status.nexus-emb.de), darin dist

# Die echte Adresse der Besucher bleibt bewusst draußen: Hier sieht nginx nur
# die Adresse des Docker-Netzes, auch im Fehlerprotokoll (docker logs). Das
# Admin Dashboard liest sie selbst aus X-Forwarded-For, das der Host mitschickt.

# Dateien unter /assets/ tragen einen Hash im Namen: neuer Inhalt, neuer Name,
# ein Jahr zwischenspeichern. Alles andere immer frisch. Als Variable statt als
# add_header je location: Ein add_header in einer location verdrängt sonst
# alle Sicherheitsheader des Servers.
map $uri $rlnexus_cache {
    "~^/assets/"   "public, max-age=31536000, immutable";
    default        "no-cache";
}

# Dockers DNS, alle zehn Sekunden neu gefragt: Bekommt das Admin Dashboard nach
# einem Neubau eine neue Adresse, findet nginx sie trotzdem.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # Das Zugriffsprotokoll schreibt nginx auf dem Host, mit gekürzter IP.
    access_log off;

    root /srv/status/dist;

    add_header Cache-Control $rlnexus_cache always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Vom Admin-Server gibt es über diese Domain nur die Statusdaten.
    location = /public/status {
        limit_except GET {
            deny all;
        }
        add_header X-Content-Type-Options "nosniff" always;
        set $rlnexus_admin http://admin:3001;
        proxy_pass $rlnexus_admin/public/status;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location ^~ /assets/ {
        try_files $uri =404;
    }

    # Eine Seite, keine Unterseiten: Jede Adresse ohne Datei bekommt index.html.
    location / {
        try_files $uri /index.html;
    }
}
