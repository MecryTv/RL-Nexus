# Die Hauptseite im Container rlnexus-website (docker-compose.prod.yml), Port 8090 auf
# 127.0.0.1. Davor steht nginx auf dem Host (nginx/nexus-emb.de.conf): Er hat das
# Zertifikat, liest die echte Adresse hinter Cloudflare und schreibt das
# Zugriffsprotokoll mit gekürzter IP. Hier geht es nur noch um die Seite.
#
# Im Container eingehängt:
#   /srv/website    WEBSITE_DIR (/var/www/nexus-emb.de), darin dist
#   /srv/content    data/content: Inhalte aus dem Admin Dashboard
#   /srv/flags      data/flags: Wartungsschalter aus dem Admin Dashboard
#   /srv/wartung    public des Admin Dashboards: die Wartungsseite

# Die echte Adresse der Besucher bleibt bewusst draußen: Hier sieht nginx nur
# die Adresse des Docker-Netzes, auch im Fehlerprotokoll (docker logs). Das
# Admin Dashboard liest sie selbst aus X-Forwarded-For, das der Host mitschickt.

# Dateien unter /assets/ tragen einen Hash im Namen: neuer Inhalt, neuer Name,
# ein Jahr zwischenspeichern. Alles andere immer frisch. Als Variable statt als
# add_header je location: Ein add_header in einer location verdrängt sonst
# alle Sicherheitsheader des Servers.
map $uri $rlnexus_cache {
    "~^/assets/"   "public, max-age=31536000, immutable";
    default        "no-cache";
}

# Dockers DNS, alle zehn Sekunden neu gefragt: Bekommt das Admin Dashboard nach
# einem Neubau eine neue Adresse, findet nginx sie trotzdem.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # Das Zugriffsprotokoll schreibt nginx auf dem Host, mit gekürzter IP.
    access_log off;

    root /srv/website/dist;
    # Der Build legt .gz fertig gepackt neben jede Datei.
    gzip_static on;

    add_header Cache-Control $rlnexus_cache always;
    # Einbetten darf die Seite nur das Admin Dashboard: Der Modul-Editor zeigt
    # /vorschau als Live-Vorschau. X-Frame-Options kennt keine fremde Adresse
    # und fehlt deshalb.
    add_header Content-Security-Policy "object-src 'none'; form-action 'self'; frame-ancestors 'self' https://admin.nexus-emb.de" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # payment für Stripe: Ohne dürfen Apple Pay und Google Pay im Zahlungsfeld nicht starten.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self \"https://js.stripe.com\"), usb=(), interest-cohort=()" always;

    # Wartung, geschaltet im Admin Dashboard: nginx schaut nur, ob die Datei da
    # ist. Dann nimmt auch /api/contact nichts an.
    if (-f /srv/flags/wartung-webseite) {
        return 503;
    }
    error_page 503 @rlnexus_wartung;

    # Die Wartungsseite mit 503 und Retry-After, damit Suchmaschinen die Seite
    # nicht für verschwunden halten. Schreibende Anfragen (etwa das
    # Kontaktformular aus einem offenen Tab) bekommen einen Satz als JSON.
    # Eigene add_header hier verdrängen die des Servers, deshalb stehen sie noch einmal da.
    location @rlnexus_wartung {
        root /srv/wartung;
        add_header Retry-After "300" always;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "object-src 'none'; form-action 'self'; frame-ancestors 'self' https://admin.nexus-emb.de" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        default_type "application/json; charset=utf-8";

        if ($request_method !~ ^(GET|HEAD)$) {
            return 503 '{"error":"Gerade ist Wartung. Versuch es in ein paar Minuten noch einmal."}';
        }

        try_files /wartung.html =503;
    }

    # Das Kontaktformular geht an das Admin Dashboard, höchstens 32 KB.
    location = /api/contact {
        client_max_body_size 32k;
        add_header X-Content-Type-Options "nosniff" always;
        set $rlnexus_admin http://admin:3001;
        proxy_pass $rlnexus_admin/public/contact;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Der Shop geht an das Admin Dashboard: Stand, Anmeldung mit Discord,
    # Test, Kasse, Fortschritt, Webhook von Stripe. Der Webhook trägt die
    # Signatur von Stripe, alles Schreibende sonst prüft der Admin-Server am Origin.
    location ^~ /api/shop/ {
        client_max_body_size 1m;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
        set $rlnexus_admin http://admin:3001;
        rewrite ^/api/shop/(.*)$ /public/shop/$1 break;
        proxy_pass $rlnexus_admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Inhalte aus dem Admin Dashboard: zuerst der gespeicherte Stand aus
    # data/content, sonst der Standard aus dem Build.
    location ^~ /content/ {
        root /srv;
        try_files $uri @rlnexus_content_default;
    }

    location @rlnexus_content_default {
        rewrite ^/content/(.*)$ /content-default/$1 break;
    }

    # Eine fehlende Datei hier und unter /assets/ (alter Tab nach einem
    # Update) ist 404 und nicht index.html.
    location ^~ /content-default/ {
        try_files $uri =404;
    }

    location ^~ /assets/ {
        try_files $uri =404;
    }

    # Zu /module/rl-tracking gibt es keine Datei. Jede solche Adresse bekommt
    # index.html, den Rest erledigt der Router der Seite.
    location / {
        try_files $uri /index.html;
    }
}
