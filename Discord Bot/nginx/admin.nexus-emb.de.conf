# Admin Dashboard: admin.nexus-emb.de
#
# nginx auf dem Host, Vorlage für /etc/nginx/sites-available/admin.nexus-emb.de:
#   sudo cp nginx/admin.nexus-emb.de.conf /etc/nginx/sites-available/admin.nexus-emb.de
#   sudo ln -s /etc/nginx/sites-available/admin.nexus-emb.de /etc/nginx/sites-enabled/admin.nexus-emb.de
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d admin.nexus-emb.de
#
# Der Block steht auf Port 80, certbot ergänzt danach Port 443 und das
# Zertifikat (docs/Hosting.md, Schritt 6). Die Datei steht für sich: Sie
# bringt ihre gemeinsamen Einstellungen selbst mit, unter eigenen Namen,
# damit nginx sie neben den anderen laden kann.
#
# Was auf dem Server dazu passen muss:
#   127.0.0.1:3001    Container rlnexus-admin (docker-compose.prod.yml). Er zeigt
#                     die Oberfläche aus /var/www/admin.nexus-emb.de/dist (auf dem
#                     Server gebaut, in den Container eingehängt) und die API.

# Im Zugriffsprotokoll steht die IP gekürzt: bei IPv4 ohne das letzte Stück,
# bei IPv6 nur die ersten drei Blöcke. So steht es in der Datenschutzerklärung.
map $remote_addr $rlnexus_ip_admin {
    "~^(?<v4>\d+\.\d+\.\d+)\.\d+$"                       $v4.0;
    "~^(?<v6>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*):"   $v6::;
    default                                              -;
}
log_format rlnexus_admin '$host $rlnexus_ip_admin [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name admin.nexus-emb.de;

    # Hinter dem Proxy von Cloudflare: die echte Adresse aus CF-Connecting-IP,
    # aber nur bei Anfragen aus den Netzen von Cloudflare. Liste von
    # https://www.cloudflare.com/ips/, Stand Oktober 2026. Ohne Cloudflare
    # schadet sie nicht.
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Eigenes Format statt des Standards, sonst schriebe Debians nginx.conf
    # zusätzlich die volle Adresse mit.
    access_log /var/log/nginx/access.log rlnexus_admin;

    # Anhänge im Postfach, zusammen bis 20 MB.
    client_max_body_size 25m;

    # Der Container setzt keine Sicherheitsheader, deshalb hier. frame-ancestors
    # 'self': Die Wartung zeigt die Wartungsseite als Vorschau in einem iframe.
    # frame-src: Der Modul-Editor lädt die Webseite (/vorschau) als Live-Vorschau.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://cdn.discordapp.com; style-src 'self' 'unsafe-inline'; frame-src 'self' https://nexus-emb.de; frame-ancestors 'self'; base-uri 'none'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Die interne Schnittstelle für das Modul Backups im Bot-Dashboard ruft nur
    # der Bot selbst auf, im Docker-Netz unter admin:3001.
    location ^~ /internal/ {
        return 404;
    }

    # Der Ereignisstrom puffert nicht: Der Server schickt X-Accel-Buffering: no.
    location / {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 1h;
    }
}
