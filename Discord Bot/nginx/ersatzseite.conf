# Ersatzseite für Adressen ohne eigene Seite: die IP des Servers, eine
# vertippte Subdomain, alles, wofür keine andere Datei zuständig ist.
#
# nginx auf dem Host, Vorlage für /etc/nginx/sites-available/ersatzseite:
#   sudo mkdir -p /var/www/ersatzseite && sudo cp nginx/ersatzseite/* /var/www/ersatzseite/
#   sudo cp nginx/snippets/rlnexus-ersatzseite.conf /etc/nginx/snippets/
#   sudo cp nginx/ersatzseite.conf /etc/nginx/sites-available/ersatzseite
#   sudo ln -s /etc/nginx/sites-available/ersatzseite /etc/nginx/sites-enabled/ersatzseite
#   sudo nginx -t && sudo systemctl reload nginx
#
# Kein certbot: Für unbekannte Namen gibt es kein Zertifikat. Über https beendet
# nginx die Verbindung gleich, statt das Zertifikat einer anderen Seite zu zeigen.
# Über http kommt die Seite mit Status 404.
#
# Was auf dem Server dazu passen muss:
#   /var/www/ersatzseite    die Seite samt Logo, Bild und Schriften (nginx/ersatzseite)
#   keine andere Datei unter /etc/nginx/sites-enabled/ mit default_server

# Im Zugriffsprotokoll steht die IP gekürzt: bei IPv4 ohne das letzte Stück,
# bei IPv6 nur die ersten drei Blöcke. So steht es in der Datenschutzerklärung.
map $remote_addr $rlnexus_ip_ersatz {
    "~^(?<v4>\d+\.\d+\.\d+)\.\d+$"                       $v4.0;
    "~^(?<v6>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*):"   $v6::;
    default                                              -;
}
log_format rlnexus_ersatz '$host $rlnexus_ip_ersatz [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Eigenes Format statt des Standards, sonst schriebe Debians nginx.conf
    # zusätzlich die volle Adresse mit.
    access_log /var/log/nginx/access.log rlnexus_ersatz;

    location ^~ /_ersatz/ {
        alias /var/www/ersatzseite/;
    }

    location / {
        return 404;
    }

    error_page 404 /_ersatz/index.html;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_reject_handshake on;
}
