# Bot-Dashboard: dashboard.nexus-emb.de
#
# nginx auf dem Host, Vorlage für /etc/nginx/sites-available/dashboard.nexus-emb.de:
#   sudo cp nginx/dashboard.nexus-emb.de.conf /etc/nginx/sites-available/dashboard.nexus-emb.de
#   sudo ln -s /etc/nginx/sites-available/dashboard.nexus-emb.de /etc/nginx/sites-enabled/dashboard.nexus-emb.de
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d dashboard.nexus-emb.de
#
# Der Block steht auf Port 80, certbot ergänzt danach Port 443 und das
# Zertifikat (docs/Hosting.md, Schritt 6). Die Datei steht für sich: Sie
# bringt ihre gemeinsamen Einstellungen selbst mit, unter eigenen Namen,
# damit nginx sie neben den anderen laden kann.
#
# Was auf dem Server dazu passen muss:
#   127.0.0.1:3000                        Container rlnexus-bot (docker-compose.prod.yml)
#   /home/rlnexus/data/flags              Wartungsschalter aus dem Admin Dashboard
#   /var/www/admin.nexus-emb.de/public    die Wartungsseite

# Im Zugriffsprotokoll steht die IP gekürzt: bei IPv4 ohne das letzte Stück,
# bei IPv6 nur die ersten drei Blöcke. So steht es in der Datenschutzerklärung.
map $remote_addr $rlnexus_ip_dashboard {
    "~^(?<v4>\d+\.\d+\.\d+)\.\d+$"                       $v4.0;
    "~^(?<v6>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*):"   $v6::;
    default                                              -;
}
log_format rlnexus_dashboard '$host $rlnexus_ip_dashboard [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

# Für Puls, Live Tickets und WebSockets.
map $http_upgrade $rlnexus_connection_dashboard {
    default   upgrade;
    ""        "";
}

server {
    listen 80;
    listen [::]:80;
    server_name dashboard.nexus-emb.de;

    # Hinter dem Proxy von Cloudflare: die echte Adresse aus CF-Connecting-IP,
    # aber nur bei Anfragen aus den Netzen von Cloudflare. Liste von
    # https://www.cloudflare.com/ips/, Stand Oktober 2026. Ohne Cloudflare
    # schadet sie nicht.
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Eigenes Format statt des Standards, sonst schriebe Debians nginx.conf
    # zusätzlich die volle Adresse mit.
    access_log /var/log/nginx/access.log rlnexus_dashboard;

    # Antwortet der Container nicht, kommt die Ersatzseite statt der grauen
    # Fehlerseite von nginx (nginx/snippets/rlnexus-ersatzseite.conf).
    include snippets/rlnexus-ersatzseite.conf;

    # Bilder bis 8 MB für die Galerie und Live Tickets.
    client_max_body_size 10m;

    # script-src 'self': Das Dashboard hat keine Inline-Skripte, alles kommt aus
    # assets/app.js. Ein eingeschleustes Skript liefe damit nicht.
    add_header Content-Security-Policy "script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Wartung des Bot-Dashboards, geschaltet im Admin Dashboard: nginx schaut
    # nur, ob die Datei da ist. Bilder holt Discord selbst, und /dcapi brauchen
    # Bot und Admin Dashboard: beides läuft weiter. /.well-known bleibt offen,
    # sonst scheitert die Verlängerung der Zertifikate. /wartung/ braucht die
    # Wartungsseite selbst (Plan 23). Impressum und Datenschutz bleiben
    # erreichbar, /assets/ brauchen sie für ihr Aussehen. Wie der lokale
    # Spiegel in src/Server.ts (DevMaintenance).
    set $rlnexus_wartung "";
    if (-f /home/rlnexus/data/flags/wartung-dashboard) {
        set $rlnexus_wartung "1";
    }
    if ($uri ~ "^/(images|dcapi|\.well-known|wartung|assets)/|^/(impressum|privacy)/?$") {
        set $rlnexus_wartung "";
    }
    if ($rlnexus_wartung) {
        return 503;
    }
    error_page 503 @rlnexus_wartung;

    # Was die Wartungsseite alle 30 Sekunden liest: der Plan aus dem Admin
    # Dashboard (wartung.json). Ohne Datei 404, dann zeigt sie „Gleich wieder da.“.
    location = /wartung/status.json {
        alias /home/rlnexus/data/flags/wartung.json;
        # Eigene add_header verdrängen die des Servers: die Sicherheits-Header noch einmal (W-0022).
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Logo, Banner und Skript der Wartungsseite (public/wartung/ im Admin Dashboard).
    # expires statt add_header: Die Header des Servers bleiben, und nach einem
    # Update fragt der Browser nach, statt ein altes wartung.js zu nehmen (W-0022).
    location ^~ /wartung/ {
        alias /var/www/admin.nexus-emb.de/public/wartung/;
        expires -1;
    }

    # Die Wartungsseite mit 503 und Retry-After. Schreibende Anfragen und
    # Skripte, die JSON wollen (ein offener Tab des Dashboards), bekommen einen
    # Satz als JSON.
    # Eigene add_header hier verdrängen die des Servers, deshalb stehen sie noch einmal da.
    location @rlnexus_wartung {
        root /var/www/admin.nexus-emb.de/public;
        add_header Retry-After "300" always;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        default_type "application/json; charset=utf-8";

        if ($request_method !~ ^(GET|HEAD)$) {
            return 503 '{"error":"Gerade ist Wartung. Versuch es in ein paar Minuten noch einmal."}';
        }
        if ($http_accept ~* "application/json") {
            return 503 '{"error":"Gerade ist Wartung. Versuch es in ein paar Minuten noch einmal."}';
        }

        try_files /wartung.html =503;
    }

    # Die Routen fürs Admin Dashboard erreicht nur das Admin Dashboard selbst,
    # im Docker-Netz unter bot:3000.
    location ^~ /dcapi/admin/ {
        return 404;
    }

    # Puls und Live Tickets kommen ohne Puffer durch: Der Bot schickt
    # X-Accel-Buffering: no.
    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $rlnexus_connection_dashboard;
        proxy_read_timeout 1h;
    }
}
