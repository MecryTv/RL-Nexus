# Gemeinsame Schutzregeln für alle Seiten (W-0106), auf der http-Ebene:
#   sudo cp nginx/rlnexus-schutz.conf /etc/nginx/conf.d/rlnexus-schutz.conf
#   sudo cp nginx/snippets/rlnexus-nur-cloudflare.conf /etc/nginx/snippets/
#   sudo nginx -t && sudo systemctl reload nginx

# Kam die Verbindung wirklich von Cloudflare? Geprüft wird die Adresse der
# TCP-Verbindung ($realip_remote_addr), nicht CF-Connecting-IP: Den Header
# kann jeder setzen, die Verbindungsadresse nicht. Liste von
# https://www.cloudflare.com/ips/, Stand Oktober 2026, wie set_real_ip_from
# in den Seiten. Der Server selbst darf immer.
geo $realip_remote_addr $rlnexus_ueber_cloudflare {
    default           0;
    127.0.0.1         1;
    ::1               1;
    103.21.244.0/22   1;
    103.22.200.0/22   1;
    103.31.4.0/22     1;
    104.16.0.0/13     1;
    104.24.0.0/14     1;
    108.162.192.0/18  1;
    131.0.72.0/22     1;
    141.101.64.0/18   1;
    162.158.0.0/15    1;
    172.64.0.0/13     1;
    173.245.48.0/20   1;
    188.114.96.0/20   1;
    190.93.240.0/20   1;
    197.234.240.0/22  1;
    198.41.128.0/17   1;
    2400:cb00::/32    1;
    2405:8100::/32    1;
    2405:b500::/32    1;
    2606:4700::/32    1;
    2803:f800::/32    1;
    2a06:98c0::/29    1;
    2c0f:f248::/32    1;
}

# Grenze pro Besucher (nach realip die echte Adresse): großzügig, damit das
# Dashboard mit allen Dateien und Live-Ansichten nie daran stößt, aber eine
# Flut aus einer Quelle abfängt.
limit_req_zone $binary_remote_addr zone=rlnexus:20m rate=30r/s;
limit_req_status 429;
