# Portainer nur übers Tailnet (W-0115): https://rlnexus-vps.tail0fd142.ts.net:9445
#
# Portainer selbst lauscht nur auf 127.0.0.1:9443. Dieser Block reicht ihn an
# Geräte im Tailnet weiter, nach demselben Muster wie Webmail auf 8444.
# Die Sperre $rlnexus_mail_tailnet kommt aus mail.nexus-emb.de (geo auf der http-Ebene).
#
#   sudo cp nginx/portainer-tailnet.conf /etc/nginx/sites-available/portainer-tailnet
#   sudo ln -s /etc/nginx/sites-available/portainer-tailnet /etc/nginx/sites-enabled/portainer-tailnet
#   sudo nginx -t && sudo systemctl reload nginx
#
# Portainer läuft ohne Compose. Start (Daten im Volume portainer_data, Lizenz per env-Datei):
#   docker run -d --name portainer --restart=always -p 127.0.0.1:9443:9443 \
#     --env-file /root/claude/portainer.env \
#     -v /var/run/docker.sock:/var/run/docker.sock -v portainer_data:/data \
#     portainer/portainer-ee:latest
server {
    listen 9445 ssl;
    listen [::]:9445 ssl;
    http2 on;
    server_name rlnexus-vps.tail0fd142.ts.net;
    ssl_certificate /etc/ssl/tailscale/rlnexus-vps.crt;
    ssl_certificate_key /etc/ssl/tailscale/rlnexus-vps.key;

    if ($rlnexus_mail_tailnet = 0) {
        return 403;
    }

    client_max_body_size 100m;

    location / {
        proxy_pass https://127.0.0.1:9443;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }
}
