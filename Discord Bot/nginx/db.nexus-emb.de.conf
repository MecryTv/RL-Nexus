# phpMyAdmin: db.nexus-emb.de
#
# nginx auf dem Host, Vorlage für /etc/nginx/sites-available/db.nexus-emb.de:
#   sudo cp nginx/db.nexus-emb.de.conf /etc/nginx/sites-available/db.nexus-emb.de
#   sudo ln -s /etc/nginx/sites-available/db.nexus-emb.de /etc/nginx/sites-enabled/db.nexus-emb.de
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d db.nexus-emb.de
#
# Der Block steht auf Port 80, certbot ergänzt danach Port 443 und das
# Zertifikat (docs/Hosting.md, Schritt 6). Die Datei steht für sich: Sie
# bringt ihre gemeinsamen Einstellungen selbst mit, unter eigenen Namen,
# damit nginx sie neben den anderen laden kann.
#
# Was auf dem Server dazu passen muss:
#   /usr/share/phpmyadmin          phpMyAdmin aus Debian (scripts/mariadb-einrichten.sh)
#   /run/php/php-fpm.sock          php-fpm, ebenso
#   /etc/nginx/db.nexus-emb.de.htpasswd
#                                  Name und Passwort für die Abfrage vor
#                                  phpMyAdmin, docs/Hosting.md Schritt 6.

# Im Zugriffsprotokoll steht die IP gekürzt: bei IPv4 ohne das letzte Stück,
# bei IPv6 nur die ersten drei Blöcke. So steht es in der Datenschutzerklärung.
map $remote_addr $rlnexus_ip_db {
    "~^(?<v4>\d+\.\d+\.\d+)\.\d+$"                       $v4.0;
    "~^(?<v6>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*):"   $v6::;
    default                                              -;
}
log_format rlnexus_db '$host $rlnexus_ip_db [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name db.nexus-emb.de;

    # Hinter dem Proxy von Cloudflare: die echte Adresse aus CF-Connecting-IP,
    # aber nur bei Anfragen aus den Netzen von Cloudflare. Liste von
    # https://www.cloudflare.com/ips/, Stand Oktober 2026. Ohne Cloudflare
    # schadet sie nicht.
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Eigenes Format statt des Standards, sonst schriebe Debians nginx.conf
    # zusätzlich die volle Adresse mit.
    access_log /var/log/nginx/access.log rlnexus_db;

    # Zwei Schlösser: erst diese Abfrage von nginx, dann die Anmeldung von
    # phpMyAdmin mit DATABASE_USER. Wer die erste nicht kennt, sieht phpMyAdmin
    # gar nicht. Die Prüfung von certbot geht trotzdem durch, sie antwortet vor
    # der Abfrage.
    auth_basic "RL Nexus Datenbank";
    auth_basic_user_file /etc/nginx/db.nexus-emb.de.htpasswd;

    root /usr/share/phpmyadmin;
    index index.php;

    # Importe in phpMyAdmin bis 64 MB, wie früher im Container (UPLOAD_LIMIT).
    client_max_body_size 64m;

    # Die übrigen Sicherheitsheader (CSP, X-Frame-Options, noindex) setzt phpMyAdmin selbst.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Einrichtungsassistent und Innereien braucht niemand im Browser.
    location ~ ^/(setup|libraries|templates|vendor|sql)(/|$) {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param PHP_VALUE "upload_max_filesize=64M\npost_max_size=64M";
        fastcgi_read_timeout 300s;
    }
}
